<body data-tool="whiteboard">
<main class="s3-main wb-main">
  <section class="s3-hero wb-hero">
    <h1>Whiteboard</h1>
    <p>Sketch, plan and explain. Everything saves itself in this browser, and you can keep several boards.</p>
  </section>

  <div class="wb-bar card">
    <div class="wb-tools" id="tools" role="toolbar" aria-label="Tools"></div>
    <span class="wb-sep"></span>
    <div class="wb-colors" id="colors" role="group" aria-label="Colour"></div>
    <span class="wb-sep"></span>
    <div class="seg wb-widths" id="widths" role="group" aria-label="Stroke width">
      <button aria-pressed="false" data-v="2" title="Thin"><i style="--w:2px"></i></button>
      <button aria-pressed="true" data-v="4" title="Medium"><i style="--w:4px"></i></button>
      <button aria-pressed="false" data-v="8" title="Thick"><i style="--w:7px"></i></button>
      <button aria-pressed="false" data-v="16" title="Extra thick"><i style="--w:11px"></i></button>
    </div>
    <span class="wb-sep"></span>
    <button class="btn icon small" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="btn icon small" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    <button class="btn icon small" id="del" title="Delete selection (Del)" aria-label="Delete selection" disabled><svg class="i"><use href="#i-trash"/></svg></button>
  </div>

  <div class="wb-stage" id="stage">
    <canvas id="cv" aria-label="Drawing board"></canvas>
    <textarea class="wb-text" id="textIn" dir="auto" hidden aria-label="Text"></textarea>
    <div class="wb-zoom">
      <button class="btn icon small" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="btn small" id="zoomReset" title="Reset view">100%</button>
      <button class="btn icon small" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="btn small" id="fit" title="Fit drawing to screen">Fit</button>
    </div>
    <div class="wb-empty" id="empty">Pick the pen and draw · <kbd>Space</kbd>+drag or two fingers to pan · <kbd>Ctrl</kbd>+scroll to zoom</div>
  </div>

  <div class="wb-bottom row between">
    <div class="row">
      <label class="sr" for="boardPick">Board</label>
      <select class="select wb-pick" id="boardPick"></select>
      <button class="btn ghost small" id="boardNew"><svg class="i"><use href="#i-plus"/></svg>New board</button>
      <button class="btn ghost small" id="boardRename">Rename</button>
      <button class="btn ghost small" id="boardDel"><svg class="i"><use href="#i-trash"/></svg>Delete board</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="grid"> Grid</label>
      <div class="seg" id="bg" role="group" aria-label="Board colour">
        <button aria-pressed="true" data-v="dark">Dark</button>
        <button aria-pressed="false" data-v="light">Light</button>
      </div>
      <button class="btn ghost small" id="clear">Clear board</button>
      <button class="btn small" id="svg"><svg class="i"><use href="#i-download"/></svg>SVG</button>
      <button class="btn small primary" id="png"><svg class="i"><use href="#i-image"/></svg>PNG</button>
    </div>
  </div>
  <p class="faint wb-saved" id="saved"></p>
</main>
<script src="app.js"></script>
</body>
</html>
